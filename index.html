<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f3e9">
  <title>LunaOS</title>
  <link rel="stylesheet" href="style.css?v=30">
</head>
<body>
  <section id="passwordGate" class="password-gate" aria-labelledby="passwordTitle">
    <form id="passwordForm" class="password-card" autocomplete="off">
      <div class="password-moon" aria-hidden="true">☾</div>
      <p class="password-eyebrow">A PRIVATE LITTLE SPACE</p>
      <h1 id="passwordTitle">Welcome back.</h1>
      <p class="password-description">Enter your password to open LunaOS.</p>
      <label class="password-label" for="osPassword">Password</label>
      <input id="osPassword" class="password-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter password" required autofocus>
      <p id="passwordError" class="password-error" role="alert" aria-live="polite"></p>
      <button class="password-submit" type="submit">Unlock LunaOS <span aria-hidden="true">→</span></button>
    </form>
  </section>
  <header class="topbar">
    <div class="logo"><span class="logo-cup">☾</span> LunaOS</div>
    <div class="topbar-right"><span class="online-dot"></span><span>YOUR LITTLE DESKTOP</span><span id="clock"></span></div>
  </header>
  <main class="desktop">
    <canvas id="rainEffects" aria-hidden="true"></canvas>
    <div class="sun-glow"></div>
    <div class="leaf leaf-one">✿</div><div class="leaf leaf-two">❋</div>
    <section class="welcome">
      <p class="eyebrow">Cute lil space :3</p>
      <h1>Welcome to<br><em>LunaOS.</em></h1>
      <p class="subtitle">For codin an whatnot</p>
      <button class="welcome-button" id="openDelta">Open Delta- <span>↗</span></button>
    </section>
    <section class="icons" aria-label="Desktop apps">
      <button class="desktop-icon" id="deltaIcon" aria-label="Open Delta-">
        <span class="icon games-icon" aria-hidden="true">◆</span><span>Delta-</span>
      </button>
      <button class="desktop-icon" id="podcastIcon" aria-label="Open Podcast Episodes">
        <span class="icon podcast-icon sound-wave-icon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span>Podcast Episodes</span>
      </button>

      <button class="desktop-icon" id="musicIcon" aria-label="Open Cistamusica">
        <span class="icon" style="background:#e9e0f6;color:#78619a" aria-hidden="true">♫</span><span>Cistamusica</span>
      </button>
    </section>
    <section id="windows" aria-label="Open app windows"></section>
  </main>
  <footer class="taskbar">
    <button id="home" title="Open Delta-">☾</button>
    <span class="dock-label">LunaOS</span>
    <div id="openApps"></div>
    <div class="dock-spacer"></div>
    <span class="dock-note">♡ Take it slow</span>
    <button id="taskbarClock" class="taskbar-clock" title="Date and time">--:--</button>
  </footer>
  <audio id="lunaRainAudio" src="./rain.mp3" autoplay loop preload="auto" aria-hidden="true"></audio>
  <script src="script.js?v=53"></script>
</body>
</html>
