<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f3e9">
  <title>Hearth OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="logo"><span class="logo-cup">☕</span> Hearth OS</div>
    <div class="topbar-right"><span class="online-dot"></span><span>YOUR COZY CORNER</span><span id="clock"></span></div>
  </header>

  <main class="desktop">
    <div class="sun-glow"></div>
    <div class="leaf leaf-one">✿</div><div class="leaf leaf-two">❋</div>
    <section class="welcome">
      <p class="eyebrow">A LITTLE SPACE OF YOUR OWN</p>
      <h1>Make yourself<br><em>at home.</em></h1>
      <p class="subtitle">A cozy place for all the things you create.</p>
      <button class="welcome-button" id="exploreButton">Open your workspace <span>↗</span></button>
    </section>

    <section class="icons" aria-label="Desktop apps">
      <button class="desktop-icon" data-app="notes"><span class="icon notes-icon">📔</span><span>Notes</span></button>
      <button class="desktop-icon" data-app="games"><span class="icon games-icon">🎮</span><span>My Games</span></button>
      <button class="desktop-icon" data-app="projects"><span class="icon projects-icon">🪴</span><span>Projects</span></button>
      <button class="desktop-icon" data-app="library"><span class="icon library-icon">🧺</span><span>App Library</span></button>
      <button class="desktop-icon" data-app="settings"><span class="icon settings-icon">⚙️</span><span>Settings</span></button>
    </section>

    <section id="windows" aria-label="Open app windows"></section>
  </main>

  <footer class="taskbar">
    <button id="home" title="Open app menu">☕</button>
    <span class="dock-label">Hearth OS</span>
    <div id="openApps"></div>
    <div class="dock-spacer"></div>
    <span class="dock-note">♡ Take it slow</span>
    <button id="taskbarClock" class="taskbar-clock" title="Date and time">--:--</button>
  </footer>

  <section id="launcher" class="launcher hidden" aria-label="App launcher">
    <div class="launcher-title"><span>YOUR LITTLE WORKSPACE</span><span>☕</span></div>
    <div class="launcher-grid">
      <button data-app="notes"><span class="icon notes-icon">📔</span>Notes</button>
      <button data-app="games"><span class="icon games-icon">🎮</span>My Games</button>
      <button data-app="projects"><span class="icon projects-icon">🪴</span>Projects</button>
      <button data-app="library"><span class="icon library-icon">🧺</span>App Library</button>
      <button data-app="settings"><span class="icon settings-icon">⚙️</span>Settings</button>
    </div>
    <p>Click an app to open it on your desktop.</p>
  </section>
  <script src="script.js"></script>
</body>
</html>
